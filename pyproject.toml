[project]
name = "eawe-challenge-res"
readme = "README.md"
description = "RES submission for the EAWE Data Science Challenge 2024"
license = { file = "LICENSE" }
authors = [
  { name = "Gabriele Calvo", email = "gabriele.calvo@res-group.com" },
  { name = "Alex Clerc", email = "Alex.Clerc@res-group.com" },
  { name = "Osman Cem Yilmaz", email = "osmancem.yilmaz@res-group.com" },
]
requires-python = ">=3.12"
version = "0.0.1"
dependencies = [
 "ipywidgets>=8.1.5",
 "matplotlib>=3.9.2",
 "pandas>=2.2.3",
 "polars>=1.9.0",
 "pwlf>=2.4.0",
 "pyarrow>=17.0.0",
 "scikit-learn>=1.6.1",
 "scipy>=1.14.1",
 "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "altair>=5.4.1",
    "jupyterlab>=4.3.0",
    "jupytext>=1.16.4",
    "mypy>=1.13.0",
    "plotly>=5.24.1",
    "poethepoet>=0.29.0",
    "ruff>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = "tests|.venv|__ignore__"

[tool.ruff]
line-length = 120
target-version = "py312"
show-fixes = true

[tool.ruff.lint]
select = [ "A", "E", "F", "UP", "I", "W", "SIM", "RUF", "C901",]
ignore = [ "A002", "A003", "RUF012", "E402"]
exclude = [ ".venv", "__ignore__",]

[tool.poe.tasks.lint]
sequence = [
    {shell = "ruff format ."},
    {shell = "ruff check . --fix"},
    {shell = "mypy ."}
]
help = "Lint"

[tool.poe.tasks.jupy]
cmd = "uv run jupyter lab"
help = "Run Jupyter lab server"
